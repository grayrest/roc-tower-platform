[package]
name = "sqlgen"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sqlgen"
path = "src/main.rs"

[dependencies]
# Shares the workspace rusqlite pin ⇒ same bundled SQLite as the host by
# construction (plan decision 8; libversion asserted at startup). Adds
# column_decltype (feature-unified across the workspace) for base-type reads.
rusqlite = { workspace = true, features = ["column_decltype"] }
