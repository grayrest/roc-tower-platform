[workspace]
resolver = "2"
members = ["crates/host", "crates/e2e-tests", "crates/sqlgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
hyper = { version = "1.6", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = [
    "server",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
http = "1.3"
http-body = "1"
http-body-util = "0.1"
bytes = "1.10"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "cors",
    "compression-gzip",
    "compression-br",
    "limit",
    "fs",
    "set-header",
] }
matchit = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
getrandom = "0.3"
argon2 = { version = "0.5", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
